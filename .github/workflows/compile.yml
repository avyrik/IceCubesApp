name: Compile Ice Cubes for iOS
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize App Configuration File
        run: |
          cp IceCubesApp.xcconfig.template IceCubesApp.xcconfig

      - name: Compile Unsigned Monolithic Scheme (Xcode 27)
        run: |
          xcodebuild build \
                     -project IceCubesApp.xcodeproj \
                     -scheme IceCubesApp \
                     -configuration Debug \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO

      - name: Locate and Package App into IPA Structure
        run: |
          mkdir -p Payload
          # Explicitly targets the local build folder generated by -derivedDataPath
          APP_PATH=$(find build -name "IceCubesApp.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r IceCubesApp.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: IceCubes-iOS-App
          path: IceCubesApp.ipa
