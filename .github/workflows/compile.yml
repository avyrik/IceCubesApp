name: Compile Ice Cubes for iOS
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Archive (Bypasses MediaUI Signing Crashes)
        run: |
          xcodebuild archive \
                     -project IceCubesApp.xcodeproj \
                     -scheme IceCubesApp \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath build/IceCubesApp.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package App into IPA Structure
        run: |
          mkdir -p Payload
          cp -r build/IceCubesApp.xcarchive/Products/Applications/IceCubesApp.app Payload/
          zip -r IceCubesApp.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: IceCubes-iOS-App
          path: IceCubesApp.ipa
