name: Compile Ice Cubes for iOS
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: macos-26 # Target the modern macOS 26 infrastructure natively
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Environment and Compiler
        run: |
          xcodebuild -version
          swift --version

      - name: Build App Archive Package
        run: |
          xcodebuild -project IceCubesApp.xcodeproj \
                     -scheme IceCubesApp \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/IceCubesApp.app Payload/
          zip -r IceCubesApp.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: IceCubes-iOS-App
          path: IceCubesApp.ipa
