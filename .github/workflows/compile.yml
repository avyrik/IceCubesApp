name: Compile Ice Cubes for iOS
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: xcode-27 # Keeping the modern environment so the code compiles natively
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize App Configuration File
        run: |
          cp IceCubesApp.xcconfig.template IceCubesApp.xcconfig

      - name: Compile Unsigned Monolithic Scheme
        run: |
          xcodebuild build \
                     -project IceCubesApp.xcodeproj \
                     -scheme IceCubesApp \
                     -configuration Debug \
                     -destination 'generic/platform=iOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     SYMROOT=build

      - name: Package App into IPA Structure (Fixed Path)
        run: |
          mkdir -p Payload
          cp -r build/Debug-iphoneos/IceCubesApp.app Payload/
          zip -r IceCubesApp.ipa Payload

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: IceCubes-iOS-App
          path: IceCubesApp.ipa
